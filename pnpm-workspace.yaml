# Supply-chain hardening: refuse any package version published less than
# 7 days ago (7 * 24 * 60 = 10080 minutes). Most malicious publishes are
# caught and unpublished well inside this window.
# Docs: https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 10080

# Add entries here only to bypass the cooldown for a verified critical
# hotfix, e.g.  - next@16.2.13
minimumReleaseAgeExclude: []

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
