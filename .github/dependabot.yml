version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Routine bumps are batched into as few PRs as possible to keep the queue
    # short. Dependabot *security* PRs are exempt from this cap and always open
    # on their own.
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # React and its types move in lockstep; split across PRs they cannot
      # typecheck.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # The client, the CLI and the driver adapter are version-locked to each
      # other — a mismatched pair fails to generate.
      prisma:
        patterns: ["prisma", "@prisma/*"]
      next:
        patterns: ["next", "@next/*", "@vercel/*", "next-themes"]
      radix:
        patterns: ["@radix-ui/*", "radix-ui"]
      test:
        patterns: ["vitest", "@vitest/*", "vite", "@vitejs/*"]
      tooling:
        patterns: ["@biomejs/*", "typescript", "tsx", "@types/node", "dotenv"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-animate-css"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
